<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWE-Game 题目总览</title>
<meta name="description" content="SWE-Game: game-mod repair and construction tasks, each with a permanent task number.">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #16181d; --muted: #5d6573; --line: #e3e6eb;
  --accent: #2f5bd3; --accent-soft: #e8eefc; --repair: #1f7a4d; --repair-soft: #e3f4ea;
  --construct: #8a4b0f; --construct-soft: #fbeedd; --hard: #b3261e; --medium: #946200; --easy: #1f7a4d;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --control: #b9c0cb; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #171a21; --ink: #e8eaef; --muted: #a0a7b4; --line: #2a2f3a;
    --accent: #7ea2ff; --accent-soft: #1d2640; --repair: #6fd3a0; --repair-soft: #15291f;
    --construct: #f0b46e; --construct-soft: #2e2213; --hard: #ff8a80; --medium: #f2c14e; --easy: #6fd3a0;
    --shadow: none; --control: #4a5260; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #171a21; --ink: #e8eaef; --muted: #a0a7b4; --line: #2a2f3a;
  --accent: #7ea2ff; --accent-soft: #1d2640; --repair: #6fd3a0; --repair-soft: #15291f;
  --construct: #f0b46e; --construct-soft: #2e2213; --hard: #ff8a80; --medium: #f2c14e; --easy: #6fd3a0;
  --shadow: none; --control: #4a5260; color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
a { color: var(--accent); }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 16px; }
header { padding: 36px 0 20px; }
h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.01em; }
.lede { margin: 0; color: var(--muted); max-width: 820px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 22px 0 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 26px; line-height: 1.1; }
.stat span { color: var(--muted); font-size: 13px; }
.controls { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0; border-bottom: 1px solid var(--line); }
.controls .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input[type="search"], select, button {
  font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--control);
  border-radius: 8px; padding: 7px 10px; min-height: 36px;
}
input[type="search"] { flex: 1 1 260px; min-width: 0; }
button { cursor: pointer; }
button:hover, select:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; min-height: 0; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.count { color: var(--muted); font-size: 13px; margin-left: auto; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 14px 0 32px; box-shadow: var(--shadow); }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--panel); }
tbody tr.task { cursor: pointer; scroll-margin-top: 200px; }
.open { all: unset; cursor: pointer; text-align: left; }
.open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
tbody tr.task:hover { background: var(--accent-soft); }
tbody tr.task[aria-expanded="true"] { background: var(--accent-soft); }
.num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; white-space: nowrap; }
.muted { color: var(--muted); }
td.c-min { white-space: nowrap; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.badge.repair { color: var(--repair); background: var(--repair-soft); }
.badge.construct { color: var(--construct); background: var(--construct-soft); }
.diff { font-size: 13px; font-weight: 600; white-space: nowrap; }
.diff.hard { color: var(--hard); } .diff.medium { color: var(--medium); } .diff.easy { color: var(--easy); }
.ds { display: inline-block; font-size: 12px; font-weight: 600; padding: 0 7px; border: 1px solid currentColor; border-radius: 6px; white-space: nowrap; }
.ds.solved { color: var(--easy); } .ds.failed { color: var(--hard); } .ds.pending { color: var(--medium); }
.ds.not-scored, .ds.not-evaluated { color: var(--muted); border-style: dashed; }
.ds-k { display: none; }
.c-result { min-width: 84px; padding-left: 8px; padding-right: 8px; }
th.c-result { max-width: 118px; text-transform: none; letter-spacing: normal; }
th.c-result .mi { width: 22px; height: 22px; border-radius: 6px; margin-bottom: 6px; }
th.c-result .mi svg { width: 14px; height: 14px; }
th.c-result .th-label { display: block; }
.ds-note { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
tr.detail td { background: var(--bg); padding: 14px 16px 18px; }
.detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 10px 0 0; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; word-break: break-word; }
.tag { display: inline-block; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin: 0 4px 4px 0; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
footer { color: var(--muted); font-size: 13px; padding: 0 0 40px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.board { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 18px; margin: 22px 0 0; box-shadow: var(--shadow); }
.board h2 { margin: 0; font-size: 17px; line-height: 1.3; }
.board .sub { margin: 4px 0 14px; color: var(--muted); font-size: 13px; max-width: 820px; }
.meters { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.meter { display: grid; grid-template-columns: minmax(150px, 340px) minmax(0, 1fr) 132px; gap: 4px 14px; align-items: center; border-radius: 6px; }
.meter:hover .meter-fill, .meter:focus-visible .meter-fill { filter: brightness(1.12); }
.meter-name { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 14px; font-weight: 600; }
.mi { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: #ffffff; border: 1px solid var(--line); color: #16181d; }
.mi svg { width: 16px; height: 16px; display: block; }
.meter-track { display: block; height: 14px; background: var(--accent-soft); border-radius: 0 4px 4px 0; }
.meter-fill { display: block; height: 100%; min-width: 2px; background: var(--accent); border-radius: 0 4px 4px 0; }
.meter-value { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meter-value b { color: var(--ink); font-size: 15px; margin-right: 6px; }
.board-tip { position: absolute; z-index: 6; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(16, 24, 40, .14); min-width: 190px; }
.board-tip b { display: block; margin-bottom: 4px; }
.board-tip div { display: flex; justify-content: space-between; gap: 18px; color: var(--muted); }
.board-tip div span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; }
@media (max-width: 640px) {
  .meter { grid-template-columns: minmax(0, 1fr) auto; }
  .meter-name { grid-row: 1; grid-column: 1 / 3; }
  .meter-track { grid-row: 2; grid-column: 1; }
  .meter-value { grid-row: 2; grid-column: 2; }
}
@media (max-width: 1360px) {
  .controls { position: static; }
  tbody tr.task { scroll-margin-top: 12px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  table, thead, tbody, tr, td { display: block; width: 100%; }
  thead { display: none; }
  table { border: none; background: none; box-shadow: none; }
  tbody tr.task { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 8px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; }
  tbody tr.task td { border: none; padding: 0; }
  tbody tr.task td.c-num { grid-row: 1; grid-column: 1; }
  tbody tr.task td.c-title { grid-row: 1; grid-column: 2 / 4; font-weight: 600; }
  tbody tr.task td.c-game { grid-row: 2; grid-column: 1 / 3; color: var(--muted); font-size: 13px; }
  tbody tr.task td.c-type { grid-row: 2; grid-column: 3; text-align: right; }
  tbody tr.task td.c-diff { grid-row: 3; grid-column: 1 / 3; font-size: 13px; }
  tbody tr.task td.c-min { grid-row: 3; grid-column: 3; text-align: right; font-size: 13px; }
  tbody tr.task td.c-result { grid-column: 1 / 4; font-size: 13px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  tbody tr.task td.c-result { margin-top: 4px; }
  .ds-k { display: inline; color: var(--muted); }
  tr.detail { margin: -6px 0 10px; }
  tr.detail td { border-radius: 0 0 10px 10px; border: 1px solid var(--line); border-top: none; }
  .detail dl { grid-template-columns: 1fr; gap: 0; }
  .detail dt { margin-top: 8px; }
}
</style>
</head>

      <th class="c-result" data-model-label="kimi"></th>

    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="empty" id="empty" hidden data-i18n="empty"></p>
</main>
<footer class="wrap"><p data-i18n="footer"></p><p><span data-i18n="iconCredit"></span> <a href="THIRD-PARTY-NOTICES.txt" data-i18n="iconLicense"></a></p></footer>

      colNumber: "题号", colGame: "游戏 / 题包", colTitle: "标题", colType: "类型", colDifficulty: "难度", colMinutes: "预计",
      minutes: "分钟", shown: "显示 {n} / {total} 道", empty: "没有符合条件的题目。",
      engine: "评测环境", source: "上游项目", license: "许可证", note: "说明", link: "本题链接",
      footer: "由 SWE-Game 仓库的 tools/site/build_site.py 生成。标题取自各题公开题面的一级标题；题面正文、私有断言、参考答案和上游修复提交不在此公开。题号永久有效，不会复用或重新分配。",
      lang: "English", langLabel: "切换到英文", themeLabel: "切换深浅色", searchLabel: "搜索",
      typeLabel: "按类型筛选", diffLabel: "按难度筛选", gamesLabel: "按游戏筛选", toggle: "展开或收起详情",
      modelLabel: "选择结果筛选所用的模型", allOutcomes: "全部结果", outcomeLabel: "按所选模型的结果筛选",
      model_dsflash: "DeepSeek Flash · 新（2026-10）", model_qwen: "Qwen3.8 27B（2026-10）", model_astra: "GPT-6 Astra（2026-10）", model_minimax: "MiniMax M3.1 Flash NVFP4（2026-11）", model_opus: "Claude Opus 5.5（2026-11）", model_kimi: "Kimi K3.1 Pro（2026-11）", model_glm: "GLM 5.3 Flash（2026-11）",
      dsNote: "各模型列展示 E1 实验中每道题唯一一次尝试的结果。当前结果筛选使用：{model}。尝试通过 mini-swe-agent 运行，只有文本与 shell 工具，没有游戏、验证器或编译器反馈（DST 与 Palworld 题另有公开的语法检查）。尝试可能针对较早版本的题目；只有与当前题目版本一致的结果才会展示。",
      "ds_solved": "唯一一次尝试通过了验证器的全部必需断言。",
      "ds_failed": "唯一一次尝试已评分，至少有一项要求未通过。",
      "ds_not-scored": "评测在观察到通过或失败之前中断，研究尚未判定原因在提交还是环境，因此既不算做对也不算做错。",
      "ds_pending": "尝试已生成，尚未在该游戏的评测主机上完成评测。",
      "ds_not-evaluated": "该模型没有与当前题目版本一致的 E1 结果：未安排评测、已从研究中撤出，或尝试针对较早版本。",
      boardTitle: "各模型做对率",
      boardSub: "做对率 = 做对题数 ÷ 当前全部 {total} 道题。每个模型每道题只有一次 E1 尝试；做错、未计分、待评测和未评测都不算做对。只统计与当前题目版本一致的结果。",
      boardValue: "{n} / {total} 道",
      boardRow: "{name}：做对 {n} / {total} 道，{pct}",
      boardLabel: "各模型做对率，按做对题数从高到低排列",
      iconCredit: "模型图标来自 LobeHub Icons（MIT 许可）；名称与标志是其所有者的商标，仅用于标识模型，不代表认可。",
      iconLicense: "第三方许可"
    },
    en: {
      title: "SWE-Game task catalogue",
      lede: "SWE-Game evaluates coding agents on game-mod tasks. A repair task supplies a real project, or one with realistically injected defects, and asks for the reported problems to be fixed without breaking existing behaviour; a construction task asks for a complete mod or plugin written to a public specification. Every task has a permanent number and is scored by its game's private verifier, most often in a real game engine or dedicated server; a few tasks evaluate only a mod loader or a source projection, and a few need an operator-supplied licensed game (see each task's note). Exam bodies, private assertions and reference solutions are not published here.",
      statTasks: "tasks", statGames: "games", statRepair: "repair tasks", statConstruct: "construction tasks",
      search: "Search number, title, game, project…", allTypes: "All types", allDiff: "All difficulties", allGames: "All games",
      colNumber: "No.", colGame: "Game / pack", colTitle: "Title", colType: "Type", colDifficulty: "Difficulty", colMinutes: "Est.",
      minutes: "min", shown: "Showing {n} of {total}", empty: "No task matches the filters.",
      engine: "Evaluation", source: "Upstream project", license: "Licence", note: "Note", link: "Link to this task",
      footer: "Generated by tools/site/build_site.py in the SWE-Game repository. Titles are the first heading of each task's public exam; exam bodies, private assertions, reference solutions and upstream fix commits are not published here. Task numbers are permanent and never reused.",
      lang: "中文", langLabel: "Switch to Chinese", themeLabel: "Toggle dark theme", searchLabel: "Search",
      typeLabel: "Filter by type", diffLabel: "Filter by difficulty", gamesLabel: "Filter by game", toggle: "Show or hide details",
      modelLabel: "Select model for the outcome filter", allOutcomes: "All outcomes", outcomeLabel: "Filter by the selected model's outcome",
      model_dsflash: "DeepSeek Flash · New (Oct 2026)", model_qwen: "Qwen3.8 27B (Oct 2026)", model_astra: "GPT-6 Astra (Oct 2026)", model_minimax: "MiniMax M3.1 Flash NVFP4 (Nov 2026)", model_opus: "Claude Opus 5.5 (Nov 2026)", model_kimi: "Kimi K3.1 Pro (Nov 2026)", model_glm: "GLM 5.3 Flash (Nov 2026)",
      dsNote: "Each model column shows the outcome of its single attempt at each task in the E1 study. The outcome filter currently uses {model}. Attempts ran through mini-swe-agent with text and shell tools only, without game, verifier or compiler feedback (DST and Palworld tasks also offer a public syntax check). Attempts may target earlier task versions; only results matching the current task version are displayed.",
      "ds_solved": "The one attempt passed every required assertion of the verifier.",
      "ds_failed": "The one attempt was scored and failed at least one requirement.",
      "ds_not-scored": "The evaluation stopped before it observed a pass or a failure, and the study has not attributed the stop to the submission or to the environment, so it counts as neither solved nor failed.",
      "ds_pending": "The attempt was generated; its evaluation on the game's host has not finished yet.",
      "ds_not-evaluated": "This model has no E1 result matching the current task version: the task was not scheduled, was withdrawn from the study, or the attempt targeted an earlier version.",
      boardTitle: "Solve rate by model",
      boardSub: "Solve rate = tasks solved ÷ all {total} current tasks. Each model made a single E1 attempt per task; failed, not scored, pending and not evaluated outcomes all count as not solved. Only results matching the current task version count.",
      boardValue: "{n} / {total}",
      boardRow: "{name}: {n} of {total} tasks solved, {pct}",
      boardLabel: "Solve rate by model, most tasks solved first",
      iconCredit: "Model icons from LobeHub Icons (MIT licence). The names and logos are trademarks of their owners, used only to identify the models; no endorsement is implied.",
      iconLicense: "Third-party notices"
    }
  };
  var state = { lang: /^zh/i.test(navigator.language || "") ? "zh" : "en", q: "", game: "", type: "", difficulty: "", model: "dsflash", outcome: "", open: null };
  var DS_GLYPHS = { solved: "✓", failed: "✕" };
  try { var saved = localStorage.getItem("swe-game-lang"); if (saved === "en" || saved === "zh") state.lang = saved; } catch (e) {}
  try { var theme = localStorage.getItem("swe-game-theme"); if (theme) document.documentElement.dataset.theme = theme; } catch (e) {}

  function modelLabel(key) {
    var model = MODELS.find(function (item) { return item.key === key; });
    return STRINGS[state.lang]["model_" + key] || model.label;
  }
  function t(key) { return STRINGS[state.lang][key].replace("{model}", modelLabel(state.model)); }
  function pick(value) { return value ? (value[state.lang] || value.en || value.zh) : ""; }
  function esc(text) {
    return String(text).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function haystack(task) {
    var source = task.source || {};
    var pack = DATA.packs[task.game + "/" + task.pack] || {};
    var type = DATA.types[task.type] || {};
    var diff = task.difficulty ? DATA.difficulty[task.difficulty] : {};
    return [task.number, task.title.en, task.title.zh, source.name || "", DATA.games[task.game].en,
      DATA.games[task.game].zh, pack.en || "", pack.zh || "", type.en || "", type.zh || "",
      diff.en || "", diff.zh || "", task.minutes ? String(task.minutes) : ""].join(" ").toLowerCase();
  }
  function dsBadge(task, model, short) {
    var result = task[model];
    var code = result.outcome;
    var label = short && DATA.deepseek.short[code] ? pick(DATA.deepseek.short[code]) : pick(result);
    var glyph = DS_GLYPHS[code] ? '<span aria-hidden="true">' + DS_GLYPHS[code] + " </span>" : "";
    return '<span class="ds ' + esc(code) + '" title="' + esc(modelLabel(model) + ": " + pick(result)) + '">' +
      glyph + esc(label) + "</span>";
  }
  TASKS.forEach(function (task) { task._text = haystack(task); });

  function matches(task) {
    if (state.game && task.game !== state.game) return false;
    if (state.type && task.type !== state.type) return false;
    if (state.difficulty && task.difficulty !== state.difficulty) return false;
    if (state.outcome && task[state.model].outcome !== state.outcome) return false;
    if (state.q) {
      var words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      for (var i = 0; i < words.length; i++) if (task._text.indexOf(words[i]) < 0) return false;
    }
    return true;
  }

  // The chart is computed here from the published per-task outcome codes alone; the payload
  // carries no aggregate.
  function boardRows() {
    return MODELS.map(function (model, index) {
      var counts = {};
      TASKS.forEach(function (task) { var code = task[model.key].outcome; counts[code] = (counts[code] || 0) + 1; });
      return { key: model.key, index: index, counts: counts, solved: counts.solved || 0 };
    }).sort(function (a, b) { return b.solved - a.solved || a.index - b.index; });
  }
  // Icons are allowlisted inline SVG from the build (build_site.load_icon), not catalog text.
  // Their ids ("mi-<key>-<n>") get a prefix per place, so a repeated icon repeats no id.
  function modelIcon(key, place) {
    var model = MODELS.find(function (item) { return item.key === key; });
    return model && model.icon ? model.icon.replace(/(id="|url\(#)mi-/g, "$1" + place + "-mi-") : "";
  }
  function percent(n, total) { return (total ? (100 * n / total).toFixed(1) : "0.0") + "%"; }
  function fill(text, values) {
    return Object.keys(values).reduce(function (out, k) { return out.replace("{" + k + "}", values[k]); }, text);
  }
  function renderBoard() {
    var total = TASKS.length;
    document.getElementById("board-sub").textContent = fill(t("boardSub"), { total: total });
    var list = document.getElementById("board-list");
    list.setAttribute("aria-label", t("boardLabel"));
    list.innerHTML = boardRows().map(function (row) {
      var name = modelLabel(row.key);
      var values = { name: name, n: row.solved, total: total, pct: percent(row.solved, total) };
      return '<li class="meter" tabindex="0" data-model="' + esc(row.key) + '" aria-label="' + esc(fill(t("boardRow"), values)) + '">' +
        '<span class="meter-name" aria-hidden="true"><span class="mi">' + modelIcon(row.key, "board") + "</span>" + esc(name) + "</span>" +
        '<span class="meter-track" aria-hidden="true"><span class="meter-fill" style="width:' + (total ? 100 * row.solved / total : 0) + '%"></span></span>' +
        '<span class="meter-value" aria-hidden="true"><b>' + values.pct + "</b>" + esc(fill(t("boardValue"), values)) + "</span></li>";
    }).join("");
    hideTip();
  }
  function showTip(item) {
    var row = boardRows().find(function (r) { return r.key === item.dataset.model; });
    var tip = document.getElementById("board-tip");
    var lines = Object.keys(DATA.deepseek.outcomes).filter(function (k) { return k === "solved" || row.counts[k]; });
    tip.innerHTML = "<b>" + esc(modelLabel(row.key)) + "</b>" + lines.map(function (k) {
      return "<div><span>" + esc(pick(DATA.deepseek.outcomes[k])) + "</span><span>" + (row.counts[k] || 0) + "</span></div>";
    }).join("");
    tip.hidden = false;
    var board = document.getElementById("board");
    var track = item.querySelector(".meter-track");
    var bar = item.querySelector(".meter-fill");
    var left = track.offsetLeft + bar.offsetWidth - tip.offsetWidth / 2;
    tip.style.left = Math.max(8, Math.min(left, board.clientWidth - tip.offsetWidth - 8)) + "px";
    tip.style.top = (item.offsetTop + item.offsetHeight + 6) + "px";
  }
  function hideTip() { document.getElementById("board-tip").hidden = true; }

  function renderStatic() {
    document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(function (node) { node.textContent = t(node.dataset.i18n); });
    document.getElementById("q").placeholder = t("search");
    document.getElementById("q").setAttribute("aria-label", t("searchLabel"));
    document.getElementById("type").setAttribute("aria-label", t("typeLabel"));
    document.getElementById("difficulty").setAttribute("aria-label", t("diffLabel"));
    document.getElementById("model").setAttribute("aria-label", t("modelLabel"));
    document.getElementById("outcome").setAttribute("aria-label", t("outcomeLabel"));
    document.querySelectorAll("[data-model-label]").forEach(function (node) {
      var key = node.dataset.modelLabel;
      node.innerHTML = '<span class="mi" aria-hidden="true">' + modelIcon(key, "th") + '</span><span class="th-label">' + esc(modelLabel(key)) + "</span>";
    });
    document.getElementById("games").setAttribute("aria-label", t("gamesLabel"));
    document.getElementById("lang").textContent = t("lang");
    document.getElementById("lang").setAttribute("title", t("langLabel"));
    document.getElementById("theme").setAttribute("aria-label", t("themeLabel"));
    var games = {}; var repair = 0;
    TASKS.forEach(function (task) { games[task.game] = true; if (task.type === "repair") repair++; });
    var stats = [[TASKS.length, "statTasks"], [Object.keys(games).length, "statGames"], [repair, "statRepair"], [TASKS.length - repair, "statConstruct"]];
    document.getElementById("stats").innerHTML = stats.map(function (s) {
      return '<div class="stat"><b>' + s[0] + "</b><span>" + esc(t(s[1])) + "</span></div>";
    }).join("");
    renderBoard();
    var type = document.getElementById("type");
    type.innerHTML = '<option value="">' + esc(t("allTypes")) + "</option>" + Object.keys(DATA.types).map(function (k) {
      return '<option value="' + k + '">' + esc(pick(DATA.types[k])) + "</option>";
    }).join("");
    type.value = state.type;
    var diff = document.getElementById("difficulty");
    diff.innerHTML = '<option value="">' + esc(t("allDiff")) + "</option>" + Object.keys(DATA.difficulty).map(function (k) {
      return '<option value="' + k + '">' + esc(pick(DATA.difficulty[k])) + "</option>";
    }).join("");
    diff.value = state.difficulty;
    var model = document.getElementById("model");
    model.innerHTML = MODELS.map(function (item) {
      return '<option value="' + esc(item.key) + '">' + esc(modelLabel(item.key)) + "</option>";
    }).join("");
    model.value = state.model;
    var present = {};
    TASKS.forEach(function (task) { present[task[state.model].outcome] = true; });
    var outcome = document.getElementById("outcome");
    outcome.innerHTML = '<option value="">' + esc(t("allOutcomes")) + "</option>" + Object.keys(DATA.deepseek.outcomes).filter(function (k) {
      return present[k];
    }).map(function (k) {
      return '<option value="' + esc(k) + '">' + esc(pick(DATA.deepseek.outcomes[k])) + "</option>";
    }).join("");
    outcome.value = state.outcome;
    var counts = {};
    TASKS.forEach(function (task) { counts[task.game] = (counts[task.game] || 0) + 1; });
    var chips = ['<button type="button" class="chip" data-game="" aria-pressed="' + (state.game === "") + '">' + esc(t("allGames")) + " · " + TASKS.length + "</button>"];
    Object.keys(DATA.games).forEach(function (g) {
      if (!counts[g]) return;
      chips.push('<button type="button" class="chip" data-game="' + g + '" aria-pressed="' + (state.game === g) + '">' + esc(pick(DATA.games[g])) + " · " + counts[g] + "</button>");
    });
    document.getElementById("games").innerHTML = chips.join("");
  }

  function detail(task) {
    var source = task.source || {};
    var rows = [];
    rows.push([t("engine"), esc(pick(DATA.engines[task.game]))]);
    if (source.name) rows.push([t("source"), esc(source.name)]);
    if (source.license) rows.push([t("license"), esc(source.license)]);
    if (task.note) rows.push([t("note"), esc(pick(task.note))]);
    MODELS.forEach(function (model) {
      rows.push([modelLabel(model.key), dsBadge(task, model.key) + ' <span class="muted">' + esc(t("ds_" + task[model.key].outcome)) + "</span>"]);
    });
    rows.push([t("link"), '<a href="#' + task.number + '">#' + task.number + "</a>"]);
    return '<div class="detail"><dl>' + rows.map(function (r) { return "<dt>" + esc(r[0]) + "</dt><dd>" + r[1] + "</dd>"; }).join("") + "</dl></div>";
  }

  function renderRows() {
    var shown = TASKS.filter(matches);
    var html = shown.map(function (task) {
      var open = state.open === task.number;
      var diff = task.difficulty ? '<span class="diff ' + task.difficulty + '">' + esc(pick(DATA.difficulty[task.difficulty])) + "</span>" : '<span class="muted">—</span>';
      var row = '<tr class="task" id="' + task.number + '" data-number="' + task.number + '">' +
        '<td class="c-num num">' + task.number + "</td>" +
        '<td class="c-game">' + esc(pick(DATA.games[task.game])) + ' <span class="muted">· ' + esc(pick(DATA.packs[task.game + "/" + task.pack])) + "</span></td>" +
        '<td class="c-title"><button type="button" class="open" aria-expanded="' + open + '" aria-controls="d-' + task.number + '" title="' + esc(t("toggle")) + '">' + esc(pick(task.title)) + "</button></td>" +
        '<td class="c-type"><span class="badge ' + task.type + '">' + esc(pick(DATA.types[task.type])) + "</span></td>" +
        '<td class="c-diff">' + diff + "</td>" +
        '<td class="c-min muted">' + (task.minutes ? task.minutes + " " + esc(t("minutes")) : "—") + "</td>" +
        MODELS.map(function (model) {
          return '<td class="c-result"><span class="ds-k">' + esc(modelLabel(model.key)) + "</span>" + dsBadge(task, model.key, true) + "</td>";
        }).join("") + "</tr>";
      if (open) row += '<tr class="detail" id="d-' + task.number + '"><td colspan="' + (6 + MODELS.length) + '">' + detail(task) + "</td></tr>";
      return row;
    }).join("");
    var focused = document.activeElement && document.activeElement.closest ? document.activeElement.closest("tr.task") : null;
    document.getElementById("rows").innerHTML = html;
    if (focused) {
      var again = document.querySelector('#' + focused.dataset.number + " .open");
      if (again) again.focus();
    }
    document.getElementById("empty").hidden = shown.length > 0;
    document.getElementById("count").textContent = t("shown").replace("{n}", shown.length).replace("{total}", TASKS.length);
  }

  function render() { renderStatic(); renderRows(); }

  var boardList = document.getElementById("board-list");
  boardList.addEventListener("mouseover", function (e) { var item = e.target.closest(".meter"); if (item) showTip(item); });
  boardList.addEventListener("mouseleave", hideTip);
  boardList.addEventListener("focusin", function (e) { var item = e.target.closest(".meter"); if (item) showTip(item); });
  boardList.addEventListener("focusout", hideTip);
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value.trim(); renderRows(); });
  document.getElementById("type").addEventListener("change", function (e) { state.type = e.target.value; renderRows(); });
  document.getElementById("difficulty").addEventListener("change", function (e) { state.difficulty = e.target.value; renderRows(); });
  document.getElementById("model").addEventListener("change", function (e) { state.model = e.target.value; state.outcome = ""; render(); });
  document.getElementById("outcome").addEventListener("change", function (e) { state.outcome = e.target.value; renderRows(); });
  document.getElementById("games").addEventListener("click", function (e) {
    var chip = e.target.closest(".chip"); if (!chip) return;
    state.game = chip.dataset.game; render();
    var same = document.querySelector('.chip[data-game="' + state.game + '"]'); if (same) same.focus();
  });
  document.getElementById("lang").addEventListener("click", function () {
    state.lang = state.lang === "zh" ? "en" : "zh";
    try { localStorage.setItem("swe-game-lang", state.lang); } catch (e) {}
    render();
  });
  document.getElementById("theme").addEventListener("click", function () {
    var root = document.documentElement;
    var dark = root.dataset.theme ? root.dataset.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("swe-game-theme", root.dataset.theme); } catch (e) {}
  });
  function toggle(number) {
    state.open = state.open === number ? null : number;
    renderRows();
    history.replaceState(null, "", state.open ? "#" + number : location.pathname + location.search);
  }
  var rows = document.getElementById("rows");
  rows.addEventListener("click", function (e) {
    var link = e.target.closest('a[href^="#SG-"]');
    if (link) { e.preventDefault(); history.replaceState(null, "", link.getAttribute("href")); openFromHash(); return; }
    if (e.target.closest("a")) return;
    var row = e.target.closest("tr.task"); if (row) toggle(row.dataset.number);
  });
  function openFromHash() {
    var number = decodeURIComponent(location.hash.slice(1));
    if (!/^SG-\d+$/.test(number)) return;
    state.open = number; state.game = ""; state.type = ""; state.difficulty = ""; state.outcome = ""; state.q = "";
    document.getElementById("q").value = "";
    render();
    var row = document.getElementById(number);
    if (row) { row.scrollIntoView({ block: "start" }); var button = row.querySelector(".open"); if (button) button.focus({ preventScroll: true }); }
  }
  window.addEventListener("hashchange", openFromHash);
  render();
  openFromHash();
})();
</script>
